<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiD-DST</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(90vw, 700px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 1.05rem;
      }

      .badge {
        display: inline-block;
        margin-bottom: 16px;
        padding: 6px 12px;
        font-size: 0.8rem;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #082f49;
        background: var(--accent);
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">AiD-DST</span>
      <h1>Welcome</h1>
      <p>
        This is the starter homepage for the AiD-DST repository.
        You can replace this file with your final landing page content.
      </p>
    </main>
  </body>
</html>
